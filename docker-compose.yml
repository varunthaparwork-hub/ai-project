services:

  # ── PostgreSQL ──────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: ecommerce_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: thaparvarun1410
      POSTGRES_DB: ecommerce_brain
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ecommerce_brain"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ── DB seed (runs once, exits) ──────────────────────────────────────────────
  seed:
    build: .
    container_name: ecommerce_seed
    depends_on:
      postgres:
        condition: service_healthy
    env_file: .env
    environment:
      DATABASE_URL: postgresql://postgres:thaparvarun1410@postgres:5432/ecommerce_brain
    command: python -m data.seed
    restart: "no"


  # ── FastAPI backend ─────────────────────────────────────────────────────────
  api:
    build: .
    container_name: ecommerce_api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      seed:
        condition: service_completed_successfully
    env_file: .env
    environment:
      DATABASE_URL: postgresql://postgres:thaparvarun1410@postgres:5432/ecommerce_brain
    ports:
      - "8000:8000"
    command: uvicorn api.main:app --host 0.0.0.0 --port 8000

volumes:
  postgres_data:
