server {
    listen      80;
    server_name _;

    root  /usr/share/nginx/html;
    index index.html;

    # SPA fallback — any unknown path serves the React app.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API proxy — SSE-safe settings.
    # The /analyze/stream endpoint emits text/event-stream; without these
    # tweaks nginx will buffer the whole response and break live streaming.
    location /api/ {
        proxy_pass         http://api:8000/api/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Connection        "";
        proxy_buffering    off;
        proxy_cache        off;
        proxy_read_timeout 5m;
        chunked_transfer_encoding off;
    }

    location /health {
        proxy_pass http://api:8000/health;
    }
}
